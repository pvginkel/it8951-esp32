# Environment for the it8951-esp32 driver: a single-repo ESP-IDF component
# library. No sibling repos, no services, no ports and nothing to deploy from
# here — the only thing the pod needs is a firmware toolchain to compile the
# two examples with.

capabilities:
  github: rw

tools:
  # ESP-IDF 5.5.3: idf.py with the Xtensa and RISC-V toolchains. The catalog
  # entry carries the sidecar's memory limit and its own ccache home overlay,
  # so neither is restated here.
  - use: esp-idf
  # native: provides clang-format for the lint gate over src/.
  - use: native
